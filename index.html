    <title>我的作品集</title>

        /* 极简样式 */
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        /* 标题 */
        .header {
            text-align: center;
            padding: 40px 0;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        /* 分类标题 */
        .category-title {
            font-size: 1.8em;
            margin: 0;  /* 改为0 */
            padding: 0; /* 改为0 */
            border-bottom: none;  /* 移除下划线 */
        }
        
         /* 分类标题栏（包含标题和按钮） */
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        
        /* 折叠按钮 */
        .toggle-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9em;
            color: #666;
            transition: all 0.2s;
        }
        
        .toggle-btn:hover {
            background: #e0e0e0;
        }
        
/* 折叠状态 - 适用于所有画廊 */
.gallery.collapsed,
#photography-gallery.collapsed,
#digital-gallery.collapsed {
    display: none;
}
        
        .toggle-btn.collapsed {
            transform: rotate(-90deg);
        }
        
        /* 作品网格 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 0;
        }

        /* 年份标题样式 */
.year-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 30px 0 15px;
    padding: 10px 15px;
    background: #f8f8f8;
    border-radius: 8px;
    border-left: 4px solid #666;
}

.year-title {
    font-size: 1.4em;
    font-weight: bold;
    color: #333;
    margin: 0;
}

.year-toggle-btn {
    background: #e0e0e0;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.8em;
    color: #555;
    transition: all 0.2s;
}

.year-toggle-btn:hover {
    background: #d0d0d0;
}

.year-toggle-btn.collapsed {
    transform: rotate(-90deg);
}

/* 年份内容区域 */
.year-content {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.year-content.collapsed {
    display: none;
}

        /* ===== 子分类样式 ===== */

/* 子分类标题栏 */
.subcategory-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 15px 0 15px;  /* 上30px，下15px，与.year-header保持一致 */
    padding: 10px 10px;
    background: #f8f8f8;
    border-radius: 8px;
    border-left: 4px solid #666;
    grid-column: 1 / -1; /* 跨越整个网格 */
}

/* 特别调整：当子分类内容折叠时，减少下方间距 */
.subcategory-content.collapsed + .subcategory-header {
    margin-top: 15px;  /* 当前一个子分类折叠时，上方间距减少 */
}

.subcategory-title {
    font-size: 1.3em;
    font-weight: bold;
    color: #333;
    margin: 0;
}

/* 子分类折叠按钮 */
.subcategory-toggle-btn {
    background: #e0e0e0;
    border: 1px solid #ccc;
    border-radius: 4px;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 0.8em;
    color: #555;
    transition: all 0.2s;
}

.subcategory-toggle-btn:hover {
    background: #d0d0d0;
}

.subcategory-toggle-btn.collapsed {
    transform: rotate(-90deg);
}

/* 子分类内容区域 */
.subcategory-content {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
    grid-column: 1 / -1; /* 跨越整个网格 */
}

.subcategory-content.collapsed {
    display: none;
}

/* 博物馆资源项的特殊样式（无预览图） */
.museum-item {
    background: white;
    padding: 20px;
    border-radius: 8px;
    border: 1px solid #eee;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 120px;
}

.museum-item .work-title {
    font-size: 1.2em;
    margin-bottom: 8px;
}

.museum-item .work-desc {
    color: #666;
    margin-bottom: 15px;
}

.museum-item .detail-link {
    display: inline-block;
    padding: 8px 16px;
    background: #f0f0f0;
    color: #333;
    text-decoration: none;
    border-radius: 4px;
    border: 1px solid #ddd;
    font-size: 0.9em;
    transition: all 0.2s;
}

.museum-item .detail-link:hover {
    background: #e0e0e0;
}

/* 手机适配 */
@media (max-width: 600px) {
    .subcategory-content {
        grid-template-columns: 1fr;
    }
}
        
/* 作品网格容器调整 - 专门针对摄影作品 */
#photography-gallery {
    display: block; /* 改为block布局，用于容纳年份分组 */
}

        /* 数字作品保持网格布局 */
#digital-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-bottom: 50px;
}
        
        /* 作品项 */
        .work-item {
            background: white;
        }
        
        .work-item img {

        display: block;
        border-radius: 5px;
        }
        
        .work-info {
            padding: 10px 0;
        }
        
        .work-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .work-desc {
            color: #666;
            font-size: 0.9em;
        }
        
        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 0;
            color: #888;
            border-top: 1px solid #eee;
            margin-top: 40px;
        }
        
        /* 手机适配 */
@media (max-width: 600px) {
    .gallery {
        grid-template-columns: 1fr;

    #digital-gallery {
        grid-template-columns: 1fr;

    }
    
    .toggle-btn {
        width: 36px;  /* 手机端更大，方便点击 */
        height: 36px;
    }
}

// ============ 绑定数字作品折叠功能 ============
function bindDigitalToggle() {
    const digitalToggleBtn = document.querySelector('[data-target="digital"]');
    if (digitalToggleBtn) {
        console.log('找到数字作品折叠按钮');
        
        digitalToggleBtn.addEventListener('click', function() {
            console.log('点击数字作品折叠按钮');
            const gallery = document.getElementById('digital-gallery');
            
            if (gallery) {
                // 切换显示/隐藏
                gallery.classList.toggle('collapsed');
                
                // 切换按钮箭头方向
                if (gallery.classList.contains('collapsed')) {
                    this.textContent = '▶';
                    this.classList.add('collapsed');
                } else {
                    this.textContent = '▼';
                    this.classList.remove('collapsed');
                }
            }
        });
    }
}

// ============ 折叠/展开功能 ============
function setupToggle() {
    // 为所有折叠按钮添加点击事件（分类折叠）
    document.querySelectorAll('.toggle-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const gallery = document.getElementById(`${targetId}-gallery`);
            
            // 切换显示/隐藏
            gallery.classList.toggle('collapsed');
            
            // 切换按钮箭头方向
            if (gallery.classList.contains('collapsed')) {
                this.textContent = '▶';
                this.classList.add('collapsed');
            } else {
                this.textContent = '▼';
                this.classList.remove('collapsed');
            }
        });
    });
    
    // ============ 年份折叠代码 ============
    // 为年份折叠按钮添加点击事件
    document.querySelectorAll('.year-toggle-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const year = this.getAttribute('data-year');
            const yearContent = document.getElementById(`year-${year}`);
            
            // 切换显示/隐藏
            yearContent.classList.toggle('collapsed');
            
            // 切换按钮箭头方向
            if (yearContent.classList.contains('collapsed')) {
                this.textContent = '▶';
                this.classList.add('collapsed');
            } else {
                this.textContent = '▼';
                this.classList.remove('collapsed');
            }
        });
    });
}  // ← setupToggle函数结束

// 点赞功能 - 简单版（点赞不可取消）
function setupLikeButton() {
    const likeBtn = document.getElementById('likeBtn');
    
    // 检查用户是否已经点赞过
    const HAS_LIKED_KEY = 'website_user_has_liked';
    let hasLiked = localStorage.getItem(HAS_LIKED_KEY) === 'true';
    
    // 如果已经点赞过，直接显示"谢谢你的点赞"
    if (hasLiked) {
        likeBtn.textContent = '🙏 谢谢你的点赞';
        likeBtn.style.background = '#e8f5e9';
        likeBtn.style.color = '#2e7d32';
        likeBtn.style.borderColor = '#c8e6c9';
        likeBtn.disabled = true;
        likeBtn.style.cursor = 'default';
    }
    
    // 点赞操作
    likeBtn.addEventListener('click', function() {
        // 防止重复点击
        if (hasLiked) return;
        
        // 禁用按钮并显示加载状态
        likeBtn.disabled = true;
        likeBtn.textContent = '点赞中...';
        
        // 模拟网络延迟
        setTimeout(() => {
            // 标记用户已点赞
            hasLiked = true;
            localStorage.setItem(HAS_LIKED_KEY, 'true');
            
            // 更新按钮文字和样式
            likeBtn.textContent = '🙏 谢谢你的点赞';
            likeBtn.style.background = '#e8f5e9';
            likeBtn.style.color = '#2e7d32';
            likeBtn.style.borderColor = '#c8e6c9';
            likeBtn.style.cursor = 'default';
        }, 300);
    });
}
